<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد الساعات والدقائق والثواني | تأثير النتيجة</title>
    
    <!-- استدعاء خطوط جوجل: Cairo للعربية و Oswald للأرقام العريضة الواضحة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-pure: #000000;
            --card-top: #141414;
            --card-bottom: #0e0e0e;
            --card-border: rgba(255, 255, 255, 0.16);
            --digit-color: #ffffff;
            --flip-speed: 0.6s;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-pure);
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* حاوية وحدة الوقت (ساعات / دقائق / ثواني) */
        .flip-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
        }

        /* البطاقة الأساسية للعداد بتقنية 3D */
        .flip-card {
            position: relative;
            width: clamp(92px, 25vw, 210px);
            height: clamp(110px, 28vw, 240px);
            background-color: var(--card-bottom);
            border-radius: clamp(12px, 2.5vw, 22px);
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(4.2rem, 15vw, 10.5rem);
            line-height: 1;
            color: var(--digit-color);
            perspective: 1200px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.95),
                0 0 0 1px var(--card-border),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* الأجزاء الأربعة المكونة لتأثير التقليب (علوي ثابت، سفلي ثابت، قلاب علوي، قلاب سفلي) */
        .flip-top,
        .flip-bottom,
        .flip-leaf-front,
        .flip-leaf-back {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* النصف العلوي */
        .flip-top,
        .flip-leaf-front {
            top: 0;
            align-items: flex-end;
            background: linear-gradient(180deg, #1a1a1a 0%, #111111 100%);
            border-top-left-radius: clamp(12px, 2.5vw, 22px);
            border-top-right-radius: clamp(12px, 2.5vw, 22px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.85);
            transform-origin: 50% 100%;
        }

        /* النصف السفلي */
        .flip-bottom,
        .flip-leaf-back {
            bottom: 0;
            align-items: flex-start;
            background: linear-gradient(180deg, #0c0c0c 0%, #151515 100%);
            border-bottom-left-radius: clamp(12px, 2.5vw, 22px);
            border-bottom-right-radius: clamp(12px, 2.5vw, 22px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            transform-origin: 50% 0%;
        }

        /* توسيط الرقم بدقة عبر خط المنتصف */
        .flip-top span,
        .flip-leaf-front span {
            transform: translateY(50%);
            display: block;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .flip-bottom span,
        .flip-leaf-back span {
            transform: translateY(-50%);
            display: block;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        /* خط المفصلة الأوسط للنتيجة الورقية */
        .flip-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #000000;
            transform: translateY(-50%);
            z-index: 20;
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.14);
        }

        /* مسامير مفصلة جانبية صغيرة لإعطاء طابع ميكانيكي واقعي */
        .hinge-left,
        .hinge-right {
            position: absolute;
            top: 50%;
            width: 5px;
            height: 12px;
            background: #262626;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transform: translateY(-50%);
            z-index: 25;
            border-radius: 2px;
        }
        .hinge-left { left: -2px; }
        .hinge-right { right: -2px; }

        /* الأوراق المتحركة أثناء التقليب */
        .flip-leaf-front {
            z-index: 10;
            transform: rotateX(0deg);
        }

        .flip-leaf-back {
            z-index: 11;
            transform: rotateX(90deg);
        }

        /* تفعيل حركة التقليب */
        .flip-card.flipping .flip-leaf-front {
            animation: flipTopDown calc(var(--flip-speed) / 2) ease-in forwards;
        }

        .flip-card.flipping .flip-leaf-back {
            animation: flipBottomDown calc(var(--flip-speed) / 2) ease-out calc(var(--flip-speed) / 2) forwards;
        }

        @keyframes flipTopDown {
            0% {
                transform: rotateX(0deg);
                filter: brightness(1);
            }
            100% {
                transform: rotateX(-90deg);
                filter: brightness(0.45);
            }
        }

        @keyframes flipBottomDown {
            0% {
                transform: rotateX(90deg);
                filter: brightness(0.5);
            }
            100% {
                transform: rotateX(0deg);
                filter: brightness(1);
            }
        }

        /* النقطتان الفاصلتان بين الساعات والدقائق والثواني */
        .colon-dots {
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2.5vw, 24px);
            padding-bottom: 2.2rem;
        }

        .colon-dot {
            width: clamp(6px, 1.2vw, 11px);
            height: clamp(6px, 1.2vw, 11px);
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0.85;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        /* إخفاء أسهم حقول الأرقام */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* تنسيق الأزرار بالأبيض والأسود عالي التباين */
        .mono-btn {
            background: #0a0a0a;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .mono-btn:hover {
            background: #1a1a1a;
            border-color: rgba(255, 255, 255, 0.5);
        }
        .mono-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 800;
        }
    </style>
</head>
<body class="flex flex-col justify-between items-center p-4 sm:p-8">

    <!-- الشريط العلوي: اختيار الوضع وأزرار الصوت وملء الشاشة -->
    <header class="w-full max-w-4xl flex flex-wrap items-center justify-between gap-4 z-30">
        <!-- أزرار التبديل بين الأوضاع -->
        <nav class="flex items-center bg-[#0a0a0a] p-1 rounded-2xl border border-white/15">
            <button data-mode="clock" class="mode-btn mono-btn active px-4 py-2 rounded-xl text-xs sm:text-sm font-bold">
                الساعة الحية
            </button>
            <button data-mode="timer" class="mode-btn mono-btn border-transparent px-4 py-2 rounded-xl text-xs sm:text-sm font-bold">
                مؤقت تنازلي
            </button>
            <button data-mode="stopwatch" class="mode-btn mono-btn border-transparent px-4 py-2 rounded-xl text-xs sm:text-sm font-bold">
                ساعة إيقاف
            </button>
        </nav>

        <!-- أدوات مساعدة: نظام 12/24 ساعة، الصوت، ملء الشاشة -->
        <div class="flex items-center gap-2">
            <!-- زر 12/24 ساعة (يظهر في وضع الساعة الحية) -->
            <button id="format-toggle" class="mono-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold tracking-wide" title="تبديل نظام 12 / 24 ساعة">
                24H
            </button>

            <!-- زر صوت تقليب الورق -->
            <button id="sound-toggle" class="mono-btn p-2.5 rounded-xl" title="تفعيل أو كتم صوت التقليب">
                <svg id="icon-sound-on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <svg id="icon-sound-off" class="w-5 h-5 hidden opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                </svg>
            </button>

            <!-- زر ملء الشاشة -->
            <button id="fullscreen-btn" class="mono-btn p-2.5 rounded-xl" title="ملء الشاشة">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- المنطقة الوسطى: بطاقات العداد القلابة (ساعات : دقائق : ثواني) -->
    <main class="my-auto flex flex-col items-center justify-center w-full py-6">
        
        <!-- شارة صباحاً / مساءً في حال اختيار نظام 12 ساعة -->
        <div id="ampm-badge" class="hidden mb-4 px-3 py-1 rounded-full border border-white/20 bg-white/5 text-xs font-bold tracking-widest text-white">
            ص
        </div>

        <!-- ترتيب البطاقات من اليسار لليمين (HH : MM : SS) لقراءة الأرقام بشكل طبيعي -->
        <div dir="ltr" class="flex items-center justify-center gap-2 sm:gap-5 md:gap-7">
            
            <!-- بطاقة الساعات -->
            <div class="flip-unit">
                <div id="card-hours" class="flip-card">
                    <div class="hinge-left"></div>
                    <div class="hinge-right"></div>
                    <div class="flip-top"><span>00</span></div>
                    <div class="flip-bottom"><span>00</span></div>
                    <div class="flip-leaf-front"><span>00</span></div>
                    <div class="flip-leaf-back"><span>00</span></div>
                </div>
                <span class="text-sm sm:text-base md:text-lg font-bold tracking-wider text-white/80">ساعات</span>
            </div>

            <!-- النقطتان الفاصلتان -->
            <div class="colon-dots" aria-hidden="true">
                <span class="colon-dot"></span>
                <span class="colon-dot"></span>
            </div>

            <!-- بطاقة الدقائق -->
            <div class="flip-unit">
                <div id="card-minutes" class="flip-card">
                    <div class="hinge-left"></div>
                    <div class="hinge-right"></div>
                    <div class="flip-top"><span>00</span></div>
                    <div class="flip-bottom"><span>00</span></div>
                    <div class="flip-leaf-front"><span>00</span></div>
                    <div class="flip-leaf-back"><span>00</span></div>
                </div>
                <span class="text-sm sm:text-base md:text-lg font-bold tracking-wider text-white/80">دقائق</span>
            </div>

            <!-- النقطتان الفاصلتان -->
            <div class="colon-dots" aria-hidden="true">
                <span class="colon-dot"></span>
                <span class="colon-dot"></span>
            </div>

            <!-- بطاقة الثواني -->
            <div class="flip-unit">
                <div id="card-seconds" class="flip-card">
                    <div class="hinge-left"></div>
                    <div class="hinge-right"></div>
                    <div class="flip-top"><span>00</span></div>
                    <div class="flip-bottom"><span>00</span></div>
                    <div class="flip-leaf-front"><span>00</span></div>
                    <div class="flip-leaf-back"><span>00</span></div>
                </div>
                <span class="text-sm sm:text-base md:text-lg font-bold tracking-wider text-white/80">ثواني</span>
            </div>

        </div>

        <!-- التاريخ الهجري / الميلادي في وضع الساعة الحية -->
        <p id="date-display" class="mt-6 text-xs sm:text-sm text-white/50 font-medium tracking-wide"></p>
    </main>

    <!-- المنطقة السفلية: أدوات التحكم في المؤقت التنازلي وساعة الإيقاف -->
    <footer class="w-full max-w-xl flex flex-col items-center justify-center min-h-[96px] z-30">
        
        <!-- لوحة ضبط المؤقت التنازلي (تظهر فقط في وضع المؤقت) -->
        <div id="timer-controls" class="hidden w-full flex flex-col items-center gap-3">
            <!-- حقول إدخال الوقت المخصص -->
            <div id="timer-inputs" dir="ltr" class="flex items-center justify-center gap-2">
                <div class="flex flex-col items-center">
                    <input type="number" id="input-hours" min="0" max="99" value="0" class="w-16 sm:w-20 py-2 text-center bg-[#0e0e0e] border border-white/25 rounded-xl text-white font-bold text-lg focus:outline-none focus:border-white">
                    <span class="text-[11px] text-white/50 mt-1 font-cairo">ساعة</span>
                </div>
                <span class="text-white/40 font-bold pb-5">:</span>
                <div class="flex flex-col items-center">
                    <input type="number" id="input-minutes" min="0" max="59" value="5" class="w-16 sm:w-20 py-2 text-center bg-[#0e0e0e] border border-white/25 rounded-xl text-white font-bold text-lg focus:outline-none focus:border-white">
                    <span class="text-[11px] text-white/50 mt-1 font-cairo">دقيقة</span>
                </div>
                <span class="text-white/40 font-bold pb-5">:</span>
                <div class="flex flex-col items-center">
                    <input type="number" id="input-seconds" min="0" max="59" value="0" class="w-16 sm:w-20 py-2 text-center bg-[#0e0e0e] border border-white/25 rounded-xl text-white font-bold text-lg focus:outline-none focus:border-white">
                    <span class="text-[11px] text-white/50 mt-1 font-cairo">ثانية</span>
                </div>
            </div>

            <!-- أزرار الاختيار السريع -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <button data-preset="300" class="preset-btn mono-btn px-3 py-1 rounded-lg text-xs">5 دقائق</button>
                <button data-preset="900" class="preset-btn mono-btn px-3 py-1 rounded-lg text-xs">15 دقيقة</button>
                <button data-preset="1500" class="preset-btn mono-btn px-3 py-1 rounded-lg text-xs">25 دقيقة</button>
                <button data-preset="3600" class="preset-btn mono-btn px-3 py-1 rounded-lg text-xs">ساعة</button>
            </div>
        </div>

        <!-- أزرار التشغيل / الإيقاف المؤقت / التصفير (للمؤقت وساعة الإيقاف) -->
        <div id="action-buttons" class="hidden flex items-center justify-center gap-3 mt-3">
            <button id="start-pause-btn" class="px-7 py-2.5 rounded-xl bg-white text-black font-extrabold text-sm hover:bg-white/90 active:scale-95 transition-all">
                ابدأ
            </button>
            <button id="reset-btn" class="mono-btn px-5 py-2.5 rounded-xl font-bold text-sm active:scale-95">
                إعادة ضبط
            </button>
        </div>

        <!-- رسالة تنبيه انتهاء المؤقت -->
        <p id="status-banner" class="mt-2 text-xs font-bold text-white tracking-wide opacity-0 transition-opacity duration-300">
            انتهى الوقت!
        </p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- عناصر البطاقات الثلاث ---
            const cards = {
                hours: document.getElementById('card-hours'),
                minutes: document.getElementById('card-minutes'),
                seconds: document.getElementById('card-seconds')
            };

            // القيم الحالية المعروضة لتجنب إعادة التقليب غير الضرورية
            const currentValues = {
                hours: '00',
                minutes: '00',
                seconds: '00'
            };

            // --- حالة التطبيق ---
            let mode = 'clock'; // 'clock' | 'timer' | 'stopwatch'
            let is24Hour = true;
            let soundEnabled = true;

            // متغيرات المؤقت وساعة الإيقاف
            let intervalId = null;
            let isRunning = false;
            let remainingSeconds = 300; // افتراضي 5 دقائق
            let initialTimerSeconds = 300;
            let elapsedSeconds = 0;

            // --- عناصر الواجهة ---
            const modeBtns = document.querySelectorAll('.mode-btn');
            const formatToggle = document.getElementById('format-toggle');
            const soundToggle = document.getElementById('sound-toggle');
            const iconSoundOn = document.getElementById('icon-sound-on');
            const iconSoundOff = document.getElementById('icon-sound-off');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const ampmBadge = document.getElementById('ampm-badge');
            const dateDisplay = document.getElementById('date-display');

            const timerControls = document.getElementById('timer-controls');
            const timerInputs = document.getElementById('timer-inputs');
            const actionButtons = document.getElementById('action-buttons');
            const startPauseBtn = document.getElementById('start-pause-btn');
            const resetBtn = document.getElementById('reset-btn');
            const statusBanner = document.getElementById('status-banner');

            const inputHours = document.getElementById('input-hours');
            const inputMinutes = document.getElementById('input-minutes');
            const inputSeconds = document.getElementById('input-seconds');
            const presetBtns = document.querySelectorAll('.preset-btn');

            // --- محرك الصوت الميكانيكي (Web Audio API) ---
            let audioCtx = null;

            function playFlipSound() {
                if (!soundEnabled) return;
                try {
                    if (!audioCtx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        audioCtx = new AudioContext();
                    }
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }

                    // محاكاة صوت سقوط ورقة النتيجة الميكانيكية (تكة خفيفة دافئة)
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(45, now + 0.035);

                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.045);
                } catch (e) {
                    // تجاهل قيود التشغيل التلقائي للصوت قبل تفاعل المستخدم
                }
            }

            function playAlarmSound() {
                if (!soundEnabled) return;
                try {
                    if (!audioCtx) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        audioCtx = new AudioContext();
                    }
                    const beeps = [0, 0.25, 0.5];
                    beeps.forEach(delay => {
                        const now = audioCtx.currentTime + delay;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, now);

                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(now);
                        osc.stop(now + 0.2);
                    });
                } catch (e) {}
            }

            // --- دالة تقليب البطاقة ثلاثية الأبعاد (3D Flip Mechanic) ---
            function flipCard(unit, newValueStr, silent = false) {
                const oldValueStr = currentValues[unit];
                if (oldValueStr === newValueStr) return;

                const card = cards[unit];
                const topStatic = card.querySelector('.flip-top span');
                const bottomStatic = card.querySelector('.flip-bottom span');
                const leafFront = card.querySelector('.flip-leaf-front span');
                const leafBack = card.querySelector('.flip-leaf-back span');

                // إعادة ضبط الحركة السابقة إن وجدت
                card.classList.remove('flipping');
                void card.offsetWidth; // إجبار المتصفح على إعادة الحساب (Reflow)

                // إعداد القيم قبل بدء التقليب:
                // النصف العلوي الثابت يعرض الرقم الجديد (سيظهر عندما تسقط الورقة الأمامية)
                // الورقة الأمامية تعرض الرقم القديم (تسقط للأسفل)
                // النصف السفلي الثابت يعرض الرقم القديم (حتى تغطيه الورقة الخلفية)
                // الورقة الخلفية تعرض الرقم الجديد (تظهر في النصف الثاني من الحركة)
                topStatic.textContent = newValueStr;
                leafFront.textContent = oldValueStr;
                bottomStatic.textContent = oldValueStr;
                leafBack.textContent = newValueStr;

                card.classList.add('flipping');
                currentValues[unit] = newValueStr;

                if (!silent) {
                    playFlipSound();
                }

                // تثبيت القيم النهائية بعد انتهاء الحركة
                clearTimeout(card._flipTimeout);
                card._flipTimeout = setTimeout(() => {
                    bottomStatic.textContent = newValueStr;
                    leafFront.textContent = newValueStr;
                    card.classList.remove('flipping');
                }, 580);
            }

            // تنسيق الرقم إلى خانتين (مثال: 5 -> "05")
            function pad2(num) {
                return String(Math.max(0, Math.floor(num))).padStart(2, '0');
            }

            // تحديث جميع البطاقات دفعة واحدة
            function updateDisplayFromSeconds(totalSec, silent = false) {
                const hrs = Math.floor(totalSec / 3600);
                const mins = Math.floor((totalSec % 3600) / 60);
                const secs = totalSec % 60;

                flipCard('hours', pad2(hrs), silent);
                flipCard('minutes', pad2(mins), silent);
                flipCard('seconds', pad2(secs), silent);
            }

            // --- وضع الساعة الحية ---
            function tickLiveClock(silent = false) {
                const now = new Date();
                let hrs = now.getHours();
                const mins = now.getMinutes();
                const secs = now.getSeconds();

                if (!is24Hour) {
                    const isPM = hrs >= 12;
                    ampmBadge.textContent = isPM ? 'مساءً' : 'صباحاً';
                    ampmBadge.classList.remove('hidden');
                    hrs = hrs % 12 || 12;
                } else {
                    ampmBadge.classList.add('hidden');
                }

                flipCard('hours', pad2(hrs), silent);
                flipCard('minutes', pad2(mins), silent);
                flipCard('seconds', pad2(secs), silent);

                // تحديث التاريخ بالعربية
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                dateDisplay.textContent = now.toLocaleDateString('ar-EG', options);
            }

            // --- إدارة الأوضاع والتشغيل ---
            function stopLoop() {
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
                isRunning = false;
            }

            function switchMode(newMode) {
                stopLoop();
                mode = newMode;
                statusBanner.classList.add('opacity-0');

                // تحديث مظهر أزرار الوضع
                modeBtns.forEach(btn => {
                    if (btn.dataset.mode === newMode) {
                        btn.classList.add('active');
                        btn.classList.remove('border-transparent');
                    } else {
                        btn.classList.remove('active');
                        btn.classList.add('border-transparent');
                    }
                });

                if (mode === 'clock') {
                    formatToggle.classList.remove('hidden');
                    dateDisplay.classList.remove('hidden');
                    timerControls.classList.add('hidden');
                    actionButtons.classList.add('hidden');

                    tickLiveClock(true);
                    intervalId = setInterval(() => tickLiveClock(false), 1000);
                } else if (mode === 'timer') {
                    formatToggle.classList.add('hidden');
                    ampmBadge.classList.add('hidden');
                    dateDisplay.classList.add('hidden');
                    timerControls.classList.remove('hidden');
                    timerInputs.classList.remove('hidden');
                    actionButtons.classList.remove('hidden');

                    startPauseBtn.textContent = 'ابدأ';
                    syncTimerFromInputs(true);
                } else if (mode === 'stopwatch') {
                    formatToggle.classList.add('hidden');
                    ampmBadge.classList.add('hidden');
                    dateDisplay.classList.add('hidden');
                    timerControls.classList.add('hidden');
                    actionButtons.classList.remove('hidden');

                    elapsedSeconds = 0;
                    startPauseBtn.textContent = 'ابدأ';
                    updateDisplayFromSeconds(0, true);
                }
            }

            // قراءة الوقت من حقول المؤقت
            function syncTimerFromInputs(silent = false) {
                const h = Math.min(99, Math.max(0, parseInt(inputHours.value, 10) || 0));
                const m = Math.min(59, Math.max(0, parseInt(inputMinutes.value, 10) || 0));
                const s = Math.min(59, Math.max(0, parseInt(inputSeconds.value, 10) || 0));

                initialTimerSeconds = h * 3600 + m * 60 + s;
                remainingSeconds = initialTimerSeconds;
                updateDisplayFromSeconds(remainingSeconds, silent);
            }

            // --- مستمعو الأحداث ---
            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => switchMode(btn.dataset.mode));
            });

            // تبديل 12 / 24 ساعة
            formatToggle.addEventListener('click', () => {
                is24Hour = !is24Hour;
                formatToggle.textContent = is24Hour ? '24H' : '12H';
                if (mode === 'clock') tickLiveClock(false);
            });

            // كتم / تفعيل الصوت
            soundToggle.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                iconSoundOn.classList.toggle('hidden', !soundEnabled);
                iconSoundOff.classList.toggle('hidden', soundEnabled);
                if (soundEnabled) playFlipSound();
            });

            // ملء الشاشة
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });

            // تحديث المؤقت عند تعديل الحقول
            [inputHours, inputMinutes, inputSeconds].forEach(inp => {
                inp.addEventListener('input', () => {
                    if (!isRunning && mode === 'timer') {
                        statusBanner.classList.add('opacity-0');
                        syncTimerFromInputs(true);
                    }
                });
            });

            // أزرار الاختيار السريع للمؤقت
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    stopLoop();
                    startPauseBtn.textContent = 'ابدأ';
                    statusBanner.classList.add('opacity-0');
                    timerInputs.classList.remove('hidden');

                    const total = parseInt(btn.dataset.preset, 10);
                    inputHours.value = Math.floor(total / 3600);
                    inputMinutes.value = Math.floor((total % 3600) / 60);
                    inputSeconds.value = total % 60;
                    syncTimerFromInputs(false);
                });
            });

            // زر التشغيل / الإيقاف المؤقت
            startPauseBtn.addEventListener('click', () => {
                if (isRunning) {
                    stopLoop();
                    startPauseBtn.textContent = 'استئناف';
                    return;
                }

                if (mode === 'timer') {
                    if (remainingSeconds <= 0) {
                        syncTimerFromInputs(true);
                    }
                    if (remainingSeconds <= 0) return;

                    statusBanner.classList.add('opacity-0');
                    timerInputs.classList.add('hidden');
                    isRunning = true;
                    startPauseBtn.textContent = 'إيقاف مؤقت';

                    intervalId = setInterval(() => {
                        remainingSeconds--;
                        updateDisplayFromSeconds(remainingSeconds, false);

                        if (remainingSeconds <= 0) {
                            stopLoop();
                            startPauseBtn.textContent = 'ابدأ';
                            timerInputs.classList.remove('hidden');
                            statusBanner.classList.remove('opacity-0');
                            playAlarmSound();
                        }
                    }, 1000);
                } else if (mode === 'stopwatch') {
                    isRunning = true;
                    startPauseBtn.textContent = 'إيقاف مؤقت';

                    intervalId = setInterval(() => {
                        elapsedSeconds++;
                        updateDisplayFromSeconds(elapsedSeconds, false);
                    }, 1000);
                }
            });

            // زر إعادة الضبط
            resetBtn.addEventListener('click', () => {
                stopLoop();
                startPauseBtn.textContent = 'ابدأ';
                statusBanner.classList.add('opacity-0');

                if (mode === 'timer') {
                    timerInputs.classList.remove('hidden');
                    syncTimerFromInputs(false);
                } else if (mode === 'stopwatch') {
                    elapsedSeconds = 0;
                    updateDisplayFromSeconds(0, false);
                }
            });

            // بدء التطبيق على وضع الساعة الحية
            switchMode('clock');
        });
    </script>
</body>
</html>
